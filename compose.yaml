services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gora
      POSTGRES_USER: gora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gora -d gora']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gora-postgres:
